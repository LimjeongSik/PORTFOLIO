<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>임정식 이력서</title>
        <meta name="description" content="프론트엔드 개발자 임정식의 이력서" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&display=swap"
            rel="stylesheet"
        />
        <style>
            /* 한글은 포트폴리오 사이트와 같은 Pretendard를 쓴다. 사이트가 구워 둔 서브셋
               (KS X 1001 2350자)을 그대로 읽고, 폴더를 옮겨 파일을 못 찾으면 CDN으로 넘어간다. */
            @font-face {
                font-family: "Pretendard";
                font-weight: 400;
                font-display: swap;
                src:
                    local("Pretendard Regular"),
                    url("../src/assets/fonts/pretendard-400.subset.woff2") format("woff2"),
                    url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Regular.woff2")
                        format("woff2");
            }
            @font-face {
                font-family: "Pretendard";
                font-weight: 500;
                font-display: swap;
                src:
                    local("Pretendard Medium"),
                    url("../src/assets/fonts/pretendard-500.subset.woff2") format("woff2"),
                    url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Medium.woff2")
                        format("woff2");
            }
            @font-face {
                font-family: "Pretendard";
                font-weight: 700;
                font-display: swap;
                src:
                    local("Pretendard Bold"),
                    url("../src/assets/fonts/pretendard-700.subset.woff2") format("woff2"),
                    url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Bold.woff2")
                        format("woff2");
            }

            /* ── 토큰 ─────────────────────────────────────────────
               이력서는 포트폴리오("어두운 전시장")의 짝이다. 서체(Pretendard + Space Grotesk)와
               보랏빛이 도는 먹색을 사이트에서 가져왔고, 색을 가진 건 프로젝트뿐이다.

               간격은 여덟 단계(--s1~--s8)만 쓴다. 위계는 크기보다 간격으로 만든다:
               섹션 사이 --s7+ · 제목→내용 --s5 · 항목 사이 --s7 · 문단 사이 --s4 · 줄 안의 짝 --s1~s2.
               줄 간격은 본문 1.8, 보조 1.75, 라벨 1.5, 제목 1.3~1.45. */
            :root {
                --desk: #e6e4ea;
                --paper: #ffffff;
                --ink: #1c1822;
                --ink-2: #3b3645;
                --muted: #6b6577;
                --line: #e4e1e9;
                --link: #1c1822;
                --todo: #c2410c;
                --accent: #4a4458;
                /* 경력 막대는 옛것(--career-old)에서 최근(--career-new)으로 섞어 쓴다.
                   회색 · 검정 대신 본문 먹색과 같은 보랏빛 계열이라 프로젝트 색과 같은 화면에서 어울린다. */
                --career-old: #d7d2e2;
                --career-new: #443c6b;

                --sans: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
                /* 숫자 · 라틴만 Space Grotesk로 그리고, 한글은 그대로 Pretendard로 떨어진다. */
                --figure: "Space Grotesk", var(--sans);

                --s1: 0.25rem;
                --s2: 0.5rem;
                --s3: 0.75rem;
                --s4: 1rem;
                --s5: 1.5rem;
                --s6: 2rem;
                --s7: 3rem;
                --s8: 4rem;

                --pad: 18mm;
                --rail: 8.4rem;
                --gap: 1.75rem;
                color-scheme: light;
            }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) {
                    --desk: #0b0a0f;
                    --paper: #15131a;
                    --ink: #eeecf2;
                    --ink-2: #c9c5d1;
                    --muted: #9a94a6;
                    --line: #2c2934;
                    --link: #eeecf2;
                    --todo: #fb923c;
                    --accent: #e7e0d2;
                    --career-old: #3b3650;
                    --career-new: #c7bff0;
                    color-scheme: dark;
                }
            }
            :root[data-theme="dark"] {
                --desk: #0b0a0f;
                --paper: #15131a;
                --ink: #eeecf2;
                --ink-2: #c9c5d1;
                --muted: #9a94a6;
                --line: #2c2934;
                --link: #eeecf2;
                --todo: #fb923c;
                --accent: #e7e0d2;
                --career-old: #3b3650;
                --career-new: #c7bff0;
                color-scheme: dark;
            }

            /* ── 바탕 ───────────────────────────────────────────── */
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }
            html {
                font-size: 15px;
                -webkit-text-size-adjust: 100%;
            }
            body {
                margin: 0;
                background: var(--desk);
                color: var(--ink);
                font-family: var(--sans);
                font-size: 1rem;
                line-height: 1.8;
                letter-spacing: -0.005em;
                word-break: keep-all;
                overflow-wrap: break-word;
                -webkit-font-smoothing: antialiased;
            }
            h1,
            h2,
            h3,
            p,
            ul,
            dl,
            dd,
            figure {
                margin: 0;
            }
            ul {
                padding: 0;
                list-style: none;
            }
            a {
                color: var(--link);
                text-decoration: underline;
                text-decoration-color: var(--line);
                text-decoration-thickness: 1px;
                text-underline-offset: 0.3em;
            }
            a:hover {
                text-decoration-color: var(--ink);
            }
            a:focus-visible,
            button:focus-visible {
                outline: 2px solid var(--ink);
                outline-offset: 3px;
                border-radius: 2px;
            }

            .toolbar {
                position: sticky;
                top: 0;
                z-index: 2;
                display: flex;
                justify-content: flex-end;
                gap: var(--s2);
                max-width: calc(210mm + 2rem);
                margin: 0 auto;
                padding: var(--s4);
            }
            .toolbar button {
                font: 500 0.93rem/1 var(--sans);
                color: var(--paper);
                background: var(--ink);
                border: 0;
                border-radius: 6px;
                padding: 0.7rem 1rem;
                cursor: pointer;
            }
            .toolbar button.ghost {
                color: var(--ink);
                background: var(--paper);
                box-shadow: inset 0 0 0 1px var(--line);
            }

            .sheet {
                width: 210mm;
                max-width: 100%;
                margin: 0 auto var(--s8);
                padding: 20mm var(--pad) 16mm;
                background: var(--paper);
                border-radius: 4px;
                box-shadow:
                    0 1px 2px rgb(23 20 29 / 0.06),
                    0 18px 40px -18px rgb(23 20 29 / 0.28);
            }

            /* ── 머리: 사진 · 이름 · 연락처 · 타임라인. 상자 없이 여백으로만 가른다 ── */
            /* 사진 열은 본문의 왼쪽 열과 같은 폭 — 이름과 본문이 한 세로선 위에 선다. */
            .head {
                display: grid;
                grid-template-columns: var(--rail) minmax(0, 1fr);
                gap: 0 var(--gap);
                align-items: end;
            }
            /* 사진이 없어도 이름은 본문 열에 선다. */
            .head .who {
                grid-column: 2;
            }
            /* 사진은 배경을 투명하게 뺀 PNG — 종이색이 그대로 비친다. */
            .photo {
                width: 100%;
                aspect-ratio: 3 / 4;
            }
            .photo img {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .name {
                font-weight: 700;
                font-size: 2.75rem;
                line-height: 1.1;
                letter-spacing: -0.035em;
            }
            .role {
                margin-top: var(--s3);
                font-weight: 500;
                font-size: 1.07rem;
                line-height: 1.5;
                color: var(--ink-2);
            }
            .current {
                display: flex;
                align-items: center;
                gap: var(--s2);
                margin-top: var(--s1);
                font-size: 0.9rem;
                line-height: 1.5;
                color: var(--muted);
            }
            .current::before {
                content: "";
                width: 0.4rem;
                height: 0.4rem;
                border-radius: 50%;
                background: var(--accent);
            }
            .tagline {
                margin-top: var(--s5);
                font-weight: 500;
                font-size: 1.13rem;
                line-height: 1.6;
                letter-spacing: -0.02em;
                color: var(--accent);
            }

            /* 연락처: 라벨을 위에, 값을 아래에 쌓아 세 칸씩. 첫 칸은 긴 주소가 들어가도록 넓다. */
            .contacts {
                display: grid;
                grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr) minmax(0, 1fr);
                gap: var(--s5) var(--s6);
                margin-top: var(--s7);
                padding-top: var(--s6);
                border-top: 1px solid var(--line);
            }
            .contact dt {
                font-size: 0.8rem;
                line-height: 1.5;
                color: var(--muted);
            }
            .contact dd {
                margin-top: var(--s1);
                font-size: 0.92rem;
                line-height: 1.5;
                overflow-wrap: anywhere;
            }

            /* ── 타임라인: 이 문서에서 유일하게 힘을 준 곳 ─────────── */
            .timeline-wrap {
                margin-top: var(--s7);
                padding-top: var(--s6);
                border-top: 1px solid var(--line);
                overflow-x: auto;
                overflow-y: hidden;
                scrollbar-width: thin;
            }
            .tl {
                position: relative;
                min-width: 34rem;
                padding: 0 0.25rem;
            }
            .tl-caption {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                gap: var(--s4);
                margin-bottom: var(--s5);
                font-size: 0.85rem;
                line-height: 1.5;
                color: var(--muted);
            }
            .tl-caption strong {
                font-family: var(--figure);
                font-weight: 600;
                font-size: 1.1rem;
                color: var(--ink);
            }
            .tl-career {
                position: relative;
                height: 7.4rem;
            }
            .tl-seg {
                position: absolute;
                bottom: 0;
                height: 0.9rem;
                border-radius: 2px;
                transform-origin: left center;
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
            .tl-seg + .tl-seg {
                /* 이어지는 막대 사이에 가는 틈 — 이직의 경계 */
                box-shadow: -1.5px 0 0 var(--paper);
            }
            .tl-label {
                position: absolute;
                bottom: calc(0.9rem + var(--s2));
                padding-left: var(--s2);
                border-left: 1px solid var(--line);
                font-size: 0.8rem;
                line-height: 1.45;
                white-space: nowrap;
            }
            .tl-label b {
                display: block;
                margin-bottom: 0.1rem;
                font-weight: 700;
                font-size: 0.86rem;
                color: var(--ink);
            }
            .tl-label span {
                color: var(--muted);
            }
            .tl-label.tier-1 {
                padding-bottom: 3.3rem;
            }
            .tl-label.tier-0 {
                /* 위층 이름표의 연결선이 이 글자를 가로지르지 않도록 바탕색으로 덮는다. */
                z-index: 1;
                padding-right: var(--s2);
                background: var(--paper);
            }
            /* 오른쪽 끝에 붙은 막대는 이름표를 막대 끝에 맞춰 왼쪽으로 뻗는다. */
            .tl-label.end {
                padding-left: 0;
                padding-right: var(--s2);
                border-left: 0;
                border-right: 1px solid var(--line);
                text-align: right;
            }
            .tl-label.tier-0.end {
                padding-left: var(--s2);
            }
            .tl-axis {
                position: relative;
                height: 2rem;
                margin-top: var(--s2);
                border-top: 1px solid var(--line);
            }
            .tl-tick {
                position: absolute;
                top: 0;
                height: 0.35rem;
                border-left: 1px solid color-mix(in oklab, var(--career-new) 45%, var(--paper));
            }
            .tl-year {
                position: absolute;
                top: 0.4rem;
                transform: translateX(-50%);
                font-family: var(--figure);
                font-size: 0.78rem;
                line-height: 1.4;
                color: color-mix(in oklab, var(--career-new) 70%, var(--muted));
                font-variant-numeric: tabular-nums;
            }
            .tl-lane {
                position: relative;
                height: 2.5rem;
            }
            .tl-bar {
                position: absolute;
                top: 0.25rem;
                height: 0.42rem;
                border-radius: 999px;
                transform-origin: left center;
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
            /* 외주 구간은 개별 날짜를 모른다 — 양 끝을 막은 가는 선으로 "여기부터 여기까지"만 말한다.
               가는 선은 가운데에 긋고, 끝 마감선은 위아래로 세운다. */
            .tl-bar.approx {
                height: 0.62rem;
                top: 0.15rem;
                border-radius: 0;
                background: none;
                border-left: 1px solid var(--accent);
                border-right: 1px solid var(--accent);
            }
            .tl-bar.approx::before {
                content: "";
                position: absolute;
                top: 50%;
                left: 0;
                right: 0;
                border-top: 1px solid var(--accent);
            }
            .tl-bar-label {
                position: absolute;
                top: 0.95rem;
                font-size: 0.8rem;
                line-height: 1.3;
                white-space: nowrap;
                color: var(--ink-2);
            }

            @media (prefers-reduced-motion: no-preference) {
                .tl-seg,
                .tl-bar {
                    animation: grow 0.9s cubic-bezier(0.22, 0.7, 0.2, 1) both;
                    animation-delay: calc(var(--i) * 70ms + 150ms);
                }
                .tl-label,
                .tl-bar-label {
                    animation: appear 0.5s ease-out both;
                    animation-delay: calc(var(--i) * 70ms + 500ms);
                }
            }
            @keyframes grow {
                from {
                    transform: scaleX(0);
                }
            }
            @keyframes appear {
                from {
                    opacity: 0;
                }
            }

            /* ── 섹션: 왼쪽 열에 제목과 기간, 오른쪽 열에 내용 ─────── */
            .block {
                margin-top: var(--s8);
                padding-top: var(--s6);
                border-top: 1px solid var(--line);
            }
            .block-head {
                display: grid;
                grid-template-columns: var(--rail) minmax(0, 1fr);
                gap: 0 var(--gap);
                align-items: baseline;
                margin-bottom: var(--s6);
            }
            .block-head h2 {
                font-weight: 700;
                font-size: 1.3rem;
                line-height: 1.3;
                letter-spacing: -0.03em;
            }
            .block-head p {
                font-size: 0.87rem;
                line-height: 1.5;
                color: var(--muted);
            }
            .body {
                margin-left: calc(var(--rail) + var(--gap));
            }

            .intro {
                display: grid;
                gap: var(--s4);
                max-width: 40em;
                color: var(--ink-2);
            }
            .strengths {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: var(--s6) var(--s6);
                margin-top: var(--s7);
            }
            .strength {
                padding-top: var(--s4);
                border-top: 2px solid var(--ink);
            }
            .strength h3 {
                font-weight: 700;
                font-size: 1rem;
                line-height: 1.5;
                letter-spacing: -0.02em;
            }
            .strength p {
                margin-top: var(--s2);
                font-size: 0.93rem;
                line-height: 1.8;
                color: var(--ink-2);
            }
            .strength .evidence {
                margin-top: var(--s3);
                font-size: 0.8rem;
                line-height: 1.5;
                color: var(--muted);
            }

            .skills {
                display: grid;
                gap: var(--s4);
            }
            .skill-row {
                display: grid;
                grid-template-columns: var(--rail) minmax(0, 1fr);
                gap: var(--gap);
                align-items: baseline;
                font-size: 0.95rem;
                line-height: 1.7;
            }
            .skill-row dt {
                font-family: var(--figure);
                font-size: 0.86rem;
                color: var(--muted);
            }
            .skill-row dd {
                display: flex;
                flex-wrap: wrap;
                gap: var(--s1) 1.25rem;
                color: var(--ink-2);
            }
            .skill-row .core {
                font-weight: 700;
                color: var(--ink);
            }

            /* ── 경력 · 프로젝트 항목 ─────────────────────────── */
            .entries {
                display: grid;
                gap: var(--s7);
            }
            .entry {
                display: grid;
                grid-template-columns: var(--rail) minmax(0, 1fr);
                gap: 0 var(--gap);
                break-inside: avoid;
            }
            .rail {
                font-size: 0.86rem;
                line-height: 1.6;
                color: var(--muted);
            }
            .rail .period {
                white-space: nowrap;
                font-family: var(--figure);
                font-weight: 500;
                color: var(--ink);
                font-variant-numeric: tabular-nums;
            }
            .rail p + p {
                margin-top: var(--s1);
            }
            .rail .now {
                display: inline-block;
                margin-top: var(--s3);
                padding: 0.1rem 0.55rem;
                border-radius: 999px;
                font-size: 0.75rem;
                font-weight: 500;
                line-height: 1.5;
                color: var(--paper);
                background: var(--ink);
            }
            .entry h3 {
                font-weight: 700;
                font-size: 1.13rem;
                line-height: 1.45;
                letter-spacing: -0.025em;
            }
            .entry .sub {
                margin-top: var(--s1);
                font-weight: 500;
                font-size: 0.93rem;
                line-height: 1.5;
                color: var(--ink-2);
            }
            .entry .summary {
                margin-top: var(--s4);
                color: var(--ink-2);
            }
            .bullets {
                margin-top: var(--s4);
                display: grid;
                gap: var(--s2);
            }
            .bullets li {
                position: relative;
                padding-left: 1.1rem;
                font-size: 0.95rem;
                line-height: 1.75;
            }
            .bullets li::before {
                content: "";
                position: absolute;
                left: 0.1rem;
                top: 0.85em;
                width: 0.4rem;
                height: 1.5px;
                background: var(--muted);
            }
            .stack {
                margin-top: var(--s4);
                font-family: var(--figure);
                font-size: 0.8rem;
                line-height: 1.6;
                color: var(--muted);
            }

            .project-title {
                display: grid;
                grid-template-columns: auto minmax(0, 1fr);
                gap: 0 var(--s4);
                align-items: center;
            }
            .app-icon {
                width: 2.8rem;
                height: 2.8rem;
                border-radius: 23%;
                overflow: hidden;
                display: grid;
                place-items: center;
                font-family: var(--figure);
                font-weight: 600;
                font-size: 1.1rem;
                color: #fff;
                box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.06);
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
            .app-icon img {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .project-title .meta {
                display: flex;
                flex-wrap: wrap;
                align-items: baseline;
                gap: 0 var(--s3);
            }
            .project-title a {
                font-family: var(--figure);
                font-size: 0.82rem;
                color: var(--muted);
            }
            .project-title .sub {
                flex-basis: 100%;
            }
            .points {
                margin-top: var(--s5);
                display: grid;
                gap: var(--s5);
            }
            .points dt {
                font-weight: 700;
                font-size: 0.96rem;
                line-height: 1.5;
                letter-spacing: -0.015em;
            }
            .points dd {
                margin-top: var(--s1);
                font-size: 0.93rem;
                line-height: 1.8;
                color: var(--ink-2);
            }
            .metrics {
                display: flex;
                flex-wrap: wrap;
                gap: var(--s2) var(--s6);
                margin-top: var(--s5);
                padding-top: var(--s4);
                border-top: 1px solid var(--line);
            }
            .metric {
                display: flex;
                align-items: baseline;
                gap: var(--s2);
                line-height: 1.5;
            }
            .metric b {
                font-family: var(--figure);
                font-weight: 600;
                font-size: 1.1rem;
                font-variant-numeric: tabular-nums;
            }
            .metric span {
                font-size: 0.8rem;
                color: var(--muted);
            }

            /* 외주 프로젝트 — 위계를 한 단계 낮춘 두 칸 목록. 카드도 번호도 없다. */
            .side-list {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: var(--s5) var(--s6);
            }
            .side-item h3 {
                font-weight: 700;
                font-size: 0.95rem;
                line-height: 1.5;
                letter-spacing: -0.015em;
            }
            .side-item .role {
                margin-left: var(--s2);
                font-weight: 500;
                font-size: 0.8rem;
                color: var(--muted);
            }
            .side-item p {
                margin-top: var(--s1);
                font-size: 0.9rem;
                line-height: 1.75;
                color: var(--ink-2);
            }
            .side-item .tech {
                margin-top: var(--s1);
                font-family: var(--figure);
                font-size: 0.78rem;
                line-height: 1.5;
                color: var(--muted);
            }

            .foot {
                margin-top: var(--s8);
                padding-top: var(--s4);
                border-top: 1px solid var(--line);
                font-family: var(--figure);
                font-size: 0.8rem;
                line-height: 1.5;
                color: var(--muted);
            }

            .todo {
                color: var(--todo);
                text-decoration: underline dashed;
                text-underline-offset: 0.25em;
            }
            .notice {
                max-width: 36rem;
                margin: 4rem auto;
                padding: 0 1rem;
            }

            /* ── 좁은 화면 ─────────────────────────────────────── */
            @media screen and (max-width: 760px) {
                html {
                    font-size: 14.5px;
                }
                :root {
                    --pad: 18px;
                }
                .toolbar {
                    padding: var(--s3) 18px;
                }
                .sheet {
                    width: auto;
                    margin: 0 0 var(--s6);
                    padding-top: var(--s6);
                    padding-bottom: var(--s6);
                    border-radius: 0;
                }
                .head {
                    grid-template-columns: 5.6rem minmax(0, 1fr);
                    gap: var(--s5);
                }
                .head.no-photo {
                    grid-template-columns: minmax(0, 1fr);
                }
                .head.no-photo .who {
                    grid-column: 1;
                }
                .name {
                    font-size: 2.2rem;
                }
                .contacts {
                    grid-template-columns: minmax(0, 1fr);
                    gap: var(--s4);
                }
                .body {
                    margin-left: 0;
                }
                .strengths,
                .entry,
                .skill-row,
                .block-head {
                    grid-template-columns: minmax(0, 1fr);
                }
                .tl-caption {
                    flex-direction: column;
                    gap: var(--s1);
                }
                .entry .rail {
                    display: flex;
                    flex-wrap: wrap;
                    align-items: baseline;
                    gap: 0 var(--s4);
                    margin-bottom: var(--s3);
                }
                .rail p + p,
                .rail .now {
                    margin-top: 0;
                }
                .skill-row {
                    gap: var(--s1);
                }
                .side-list {
                    grid-template-columns: minmax(0, 1fr);
                }
            }

            /* ── 출력 (PDF로 저장) ─────────────────────────────── */
            @page {
                size: A4;
                margin: 15mm 16mm 15mm;
            }
            @media print {
                :root,
                :root[data-theme="dark"] {
                    --paper: #ffffff;
                    --ink: #1c1822;
                    --ink-2: #3b3645;
                    --muted: #676173;
                    --line: #e0dde6;
                    --link: #1c1822;
                    --accent: #4a4458;
                    --career-old: #d7d2e2;
                    --career-new: #443c6b;
                    color-scheme: light;
                }
                html {
                    font-size: 9pt;
                }
                body {
                    background: #fff;
                }
                .toolbar,
                .todo,
                .todo-row {
                    display: none;
                }
                .sheet {
                    width: auto;
                    margin: 0;
                    padding: 0;
                    box-shadow: none;
                    border-radius: 0;
                }
                .timeline-wrap {
                    overflow: visible;
                }
                .tl-seg,
                .tl-bar,
                .tl-label,
                .tl-bar-label {
                    animation: none;
                }
                .block-head,
                .entry h3,
                .project-title {
                    break-after: avoid;
                }
                /* 항목을 통째로 안 끊으면 긴 프로젝트가 다음 쪽으로 밀려 빈자리가 크게 남는다.
                   긴 항목은 사례 단위로만 끊고, 머리(아이콘 · 제목 · 요약)는 첫 사례와 붙여 둔다. */
                .projects .entry,
                .body,
                .strengths {
                    break-inside: auto;
                }
                /* 첫 장에 핵심 역량 첫 줄까지 들어가도록 머리 쪽 간격을 한 단계씩 줄인다. */
                .contacts,
                .timeline-wrap {
                    margin-top: var(--s5);
                    padding-top: var(--s5);
                }
                .block {
                    margin-top: var(--s7);
                }
                .strengths {
                    margin-top: var(--s5);
                }
                .strength,
                .side-item,
                .points > div,
                .metrics,
                .bullets li {
                    break-inside: avoid;
                }
                .entry .summary {
                    break-after: avoid;
                }
                /* 기술 목록 한 줄만 다음 쪽으로 떨어지지 않게 수치 줄과 붙여 둔다. */
                .stack {
                    break-before: avoid;
                }
                /* 크롬은 격자를 쪽 사이에서 잘 나누지 못해 핵심 역량이 통째로 다음 쪽으로 밀린다.
                   출력에서만 두 칸을 인라인 블록으로 늘어놓아 줄 단위로 끊기게 한다. */
                .strengths {
                    display: block;
                    font-size: 0;
                }
                .strength {
                    display: inline-block;
                    vertical-align: top;
                    width: calc(50% - var(--s6) / 2);
                    margin-bottom: var(--s6);
                    font-size: 1rem;
                }
                .strength:nth-child(odd) {
                    margin-right: var(--s6);
                }
            }
        </style>
    </head>
    <body>
        <div class="toolbar">
            <button type="button" class="ghost" id="theme">어두운 화면</button>
            <button type="button" id="print">PDF로 저장</button>
        </div>
        <main class="sheet" id="resume">
            <noscript>
                <p>이력서는 content.js의 내용을 읽어 그립니다. 자바스크립트를 켜 주세요.</p>
            </noscript>
        </main>

        <script src="content.js"></script>
        <script>
            (() => {
                const data = window.RESUME;
                const root = document.getElementById("resume");

                if (!data) {
                    root.replaceChildren(
                        el("div", { class: "notice" }, [
                            el("p", {}, "content.js를 읽지 못했습니다. index.html과 같은 폴더에 있는지 확인하세요."),
                        ]),
                    );
                    return;
                }

                // ── 작은 도우미 ────────────────────────────────
                function el(tag, attrs = {}, children = []) {
                    const node = document.createElement(tag);
                    for (const [key, value] of Object.entries(attrs)) {
                        if (value === undefined || value === null || value === false) continue;
                        if (key === "style") {
                            for (const [prop, v] of Object.entries(value)) {
                                const name = prop.startsWith("--")
                                    ? prop
                                    : prop.replace(/[A-Z]/g, (c) => `-${c.toLowerCase()}`);
                                node.style.setProperty(name, v);
                            }
                        } else node.setAttribute(key, value);
                    }
                    const list = Array.isArray(children) ? children : [children];
                    for (const child of list) {
                        if (child === null || child === undefined || child === false) continue;
                        node.append(child instanceof Node ? child : document.createTextNode(child));
                    }
                    return node;
                }

                const isTodo = (value) => typeof value === "string" && value.startsWith("TODO");
                // "TODO"로 시작하는 값은 화면에서만 점선으로 드러내고 출력에서는 숨긴다.
                const text = (value) =>
                    isTodo(value) ? el("span", { class: "todo" }, value.replace(/^TODO:?\s*/, "")) : value;

                const now = new Date();
                const nowMonth = now.getFullYear() * 12 + now.getMonth();
                const isCurrent = (period) => /현재\s*$/.test(period);

                // "2024.08 — 현재" → { start, end } (월 단위 정수, 끝 달 포함)
                function parsePeriod(period) {
                    const [from, to] = period.split(/\s*[—–-]\s*/);
                    const toMonth = (s) => {
                        const [y, m] = s.trim().split(".").map(Number);
                        return y * 12 + (m - 1);
                    };
                    const start = toMonth(from);
                    const end = !to || to.trim() === "현재" ? nowMonth : toMonth(to);
                    return { start, end };
                }

                function formatSpan(months) {
                    const y = Math.floor(months / 12);
                    const m = months % 12;
                    if (y && m) return `${y}년 ${m}개월`;
                    if (y) return `${y}년`;
                    return `${m}개월`;
                }
                const spanOf = ({ start, end }) => end - start + 1;

                // 겹치는 기간을 한 번만 세는 총 경력
                function totalMonths(periods) {
                    const covered = new Set();
                    for (const { start, end } of periods) {
                        for (let i = start; i <= end; i++) covered.add(i);
                    }
                    return covered.size;
                }

                const { profile } = data;
                const careers = data.experience.map((e) => ({ ...e, span: parsePeriod(e.period) }));
                const projects = data.projects.map((p) => ({ ...p, span: parsePeriod(p.period) }));
                const total = totalMonths(careers.map((c) => c.span));

                // ── 머리 ─────────────────────────────────────
                // 라벨을 위에, 값을 아래에 쌓는다. <div>로 dt · dd 한 쌍을 묶는다.
                const contacts = el(
                    "dl",
                    { class: "contacts" },
                    [...profile.contacts, ...profile.facts].map((c) => {
                        const todo = isTodo(c.value);
                        const value = c.href && !todo ? el("a", { href: c.href }, c.value) : text(c.value);
                        return el("div", { class: todo ? "contact todo-row" : "contact" }, [
                            el("dt", {}, c.label),
                            el("dd", {}, value),
                        ]);
                    }),
                );

                const head = el("div", { class: profile.photo ? "head" : "head no-photo" }, [
                    profile.photo
                        ? el("figure", { class: "photo" }, [
                              el("img", { src: profile.photo, alt: `${profile.name} 프로필 사진` }),
                          ])
                        : null,
                    el("div", { class: "who" }, [
                        el("h1", { class: "name" }, profile.name),
                        el("p", { class: "role" }, profile.role),
                        profile.current ? el("p", { class: "current" }, profile.current) : null,
                        el("p", { class: "tagline" }, profile.tagline),
                    ]),
                ]);

                // ── 타임라인 ─────────────────────────────────
                function buildTimeline() {
                    const all = [...careers, ...projects].map((x) => x.span);
                    const min = Math.min(...all.map((s) => s.start));
                    const max = Math.max(...all.map((s) => s.end)) + 1;
                    const pct = (month) => `${((month - min) / (max - min)) * 100}%`;
                    const width = (s) => `${((s.end + 1 - s.start) / (max - min)) * 100}%`;

                    // 오른쪽 끝에 붙은 막대는 이름표가 판 밖으로 나가지 않게 끝에 맞춘다.
                    const atEnd = (span) => (span.start - min) / (max - min) > 0.72;
                    const anchor = (span) =>
                        atEnd(span)
                            ? { right: `calc(100% - ${pct(span.end + 1)})` }
                            : { left: pct(span.start) };

                    // 경력은 오래된 것부터 왼쪽. 이름표는 두 높이를 번갈아 써서 겹치지 않게 한다.
                    const ordered = [...careers].sort((a, b) => a.span.start - b.span.start);
                    const last = Math.max(ordered.length - 1, 1);
                    const career = el(
                        "div",
                        { class: "tl-career" },
                        ordered.flatMap((c, i) => [
                            el("div", {
                                class: "tl-seg",
                                style: {
                                    left: pct(c.span.start),
                                    width: width(c.span),
                                    // 오래된 것일수록 옅게 — 가장 최근이 잉크 그대로다.
                                    background: `color-mix(in oklab, var(--career-new) ${Math.round(18 + (82 * i) / last)}%, var(--career-old))`,
                                    "--i": i,
                                },
                            }),
                            el(
                                "div",
                                {
                                    class: `tl-label tier-${i % 2 === 0 ? 1 : 0}${atEnd(c.span) ? " end" : ""}`,
                                    style: { ...anchor(c.span), "--i": i },
                                },
                                [el("b", {}, c.short || c.company), el("span", {}, c.position)],
                            ),
                        ]),
                    );

                    const axis = el("div", { class: "tl-axis" });
                    // 범위 안에 들어오는 첫 1월부터 눈금을 긋는다(시작이 1월이면 그해부터).
                    const firstYear = Math.ceil(min / 12);
                    const lastYear = Math.floor((max - 1) / 12);
                    for (let y = firstYear; y <= lastYear; y++) {
                        axis.append(
                            el("div", { class: "tl-tick", style: { left: pct(y * 12) } }),
                            el("div", { class: "tl-year", style: { left: pct(y * 12) } }, String(y)),
                        );
                    }

                    // 프로젝트는 겹치는 기간이 있어 줄(lane)을 나눠 쌓는다.
                    // 외주 구간은 기간만 아는 묶음이라 점선 막대 하나로 같은 줄에 태운다.
                    const side =
                        data.sideProjectsSpan && data.sideProjects?.length
                            ? [
                                  {
                                      title: `외주 프로젝트 ${data.sideProjects.length}건`,
                                      span: parsePeriod(data.sideProjectsSpan),
                                      approx: true,
                                  },
                              ]
                            : [];
                    const lanes = [];
                    const sorted = [...projects, ...side].sort((a, b) => a.span.start - b.span.start);
                    for (const p of sorted) {
                        let lane = lanes.findIndex((l) => l.at(-1).span.end < p.span.start);
                        if (lane === -1) {
                            lanes.push([]);
                            lane = lanes.length - 1;
                        }
                        lanes[lane].push(p);
                    }
                    let n = 0;
                    const projectRows = el(
                        "div",
                        { class: "tl-projects" },
                        lanes.map((lane) =>
                            el(
                                "div",
                                { class: "tl-lane" },
                                lane.flatMap((p) => {
                                    const i = ordered.length + n++;
                                    return [
                                        el("div", {
                                            class: p.approx ? "tl-bar approx" : "tl-bar",
                                            style: {
                                                left: pct(p.span.start),
                                                width: width(p.span),
                                                background: p.approx ? undefined : p.color,
                                                "--i": i,
                                            },
                                        }),
                                        el(
                                            "div",
                                            { class: "tl-bar-label", style: { ...anchor(p.span), "--i": i } },
                                            p.title,
                                        ),
                                    ];
                                }),
                            ),
                        ),
                    );

                    const first = careers.reduce((a, b) => (a.span.start < b.span.start ? a : b));
                    return el("div", { class: "timeline-wrap" }, [
                        el(
                            "div",
                            {
                                class: "tl",
                                role: "img",
                                "aria-label": `${first.period.split(/\s*—/)[0]}부터 지금까지 ${formatSpan(total)}의 경력과 프로젝트 기간`,
                            },
                            [
                                el("div", { class: "tl-caption" }, [
                                    el("strong", {}, `경력 ${formatSpan(total)}`),
                                    el("span", {}, "위는 소속과 직무, 아래는 프로젝트 — 괄호선은 기간만 아는 외주 묶음"),
                                ]),
                                career,
                                axis,
                                projectRows,
                            ],
                        ),
                    ]);
                }

                // ── 섹션 ─────────────────────────────────────
                // 제목은 왼쪽 열에, 곁들이는 한 줄은 오른쪽 열에 둔다.
                function block(title, aside, children, extra) {
                    return el("section", { class: extra ? `block ${extra}` : "block" }, [
                        el("div", { class: "block-head" }, [
                            el("h2", {}, title),
                            aside ? el("p", {}, aside) : null,
                        ]),
                        ...children,
                    ]);
                }

                const about = block("소개", null, [
                    el("div", { class: "body" }, [
                        el(
                            "div",
                            { class: "intro" },
                            profile.intro.map((p) => el("p", {}, text(p))),
                        ),
                        el(
                            "div",
                            { class: "strengths" },
                            data.strengths.map((s) =>
                                el("article", { class: "strength" }, [
                                    el("h3", {}, s.title),
                                    el("p", {}, text(s.body)),
                                    s.evidence?.length
                                        ? el(
                                              "p",
                                              { class: "evidence" },
                                              `관련 프로젝트: ${s.evidence.join(", ")}`,
                                          )
                                        : null,
                                ]),
                            ),
                        ),
                    ]),
                ]);

                const skills = block("기술", "굵은 글씨는 실무에서 가장 오래, 자주 쓴 기술", [
                    el(
                        "dl",
                        { class: "skills" },
                        data.skills.map((g) =>
                            el("div", { class: "skill-row" }, [
                                el("dt", {}, g.label),
                                el(
                                    "dd",
                                    {},
                                    g.items.map((item) =>
                                        el("span", { class: item.core ? "core" : undefined }, item.name),
                                    ),
                                ),
                            ]),
                        ),
                    ),
                ]);

                const railFor = (item, extra = []) =>
                    el("div", { class: "rail" }, [
                        el("p", { class: "period" }, item.period),
                        el("p", {}, formatSpan(spanOf(item.span))),
                        ...extra,
                        isCurrent(item.period) ? el("span", { class: "now" }, item.nowLabel) : null,
                    ]);

                const experience = block("경력", `총 ${formatSpan(total)}`, [
                    el(
                        "div",
                        { class: "entries" },
                        careers.map((c) =>
                            el("article", { class: "entry" }, [
                                railFor({ ...c, nowLabel: "재직 중" }),
                                el("div", {}, [
                                    el("h3", {}, c.company),
                                    el("p", { class: "sub" }, c.position),
                                    el("p", { class: "summary" }, text(c.summary)),
                                    el(
                                        "ul",
                                        { class: "bullets" },
                                        c.achievements.map((a) => el("li", {}, text(a))),
                                    ),
                                    c.stack?.length
                                        ? el("p", { class: "stack" }, c.stack.join(", "))
                                        : null,
                                ]),
                            ]),
                        ),
                    ),
                ]);

                // 앱 아이콘이 있으면 그것을, 없으면 브랜드 색 위에 첫 글자를 둔다.
                const appIcon = (p) =>
                    el(
                        "div",
                        {
                            class: "app-icon",
                            style: p.icon ? undefined : { background: p.color },
                            "aria-hidden": "true",
                        },
                        p.icon ? el("img", { src: p.icon, alt: "" }) : p.title.slice(0, 1),
                    );

                const projectBlock = block("프로젝트", "주요 문제와 해결 방법 위주로", [
                    el(
                        "div",
                        { class: "entries" },
                        projects.map((p) =>
                            el("article", { class: "entry" }, [
                                railFor({ ...p, nowLabel: "진행 중" }, [el("p", {}, p.platform)]),
                                el("div", {}, [
                                    el("div", { class: "project-title" }, [
                                        appIcon(p),
                                        el("div", { class: "meta" }, [
                                            el("h3", {}, p.title),
                                            p.link
                                                ? el(
                                                      "a",
                                                      { href: p.link, target: "_blank", rel: "noopener" },
                                                      p.link.replace(/^https?:\/\//, ""),
                                                  )
                                                : null,
                                            el(
                                                "p",
                                                { class: "sub" },
                                                p.org ? `${p.role}, ${p.org}` : p.role,
                                            ),
                                        ]),
                                    ]),
                                    el("p", { class: "summary" }, text(p.summary)),
                                    el(
                                        "dl",
                                        { class: "points" },
                                        p.points.map((pt) =>
                                            el("div", {}, [
                                                el("dt", {}, pt.title),
                                                el("dd", {}, text(pt.body)),
                                            ]),
                                        ),
                                    ),
                                    p.metrics?.length
                                        ? el(
                                              "div",
                                              { class: "metrics" },
                                              p.metrics.map((m) =>
                                                  el("p", { class: "metric" }, [
                                                      el("b", {}, m.value),
                                                      el("span", {}, m.label),
                                                  ]),
                                              ),
                                          )
                                        : null,
                                    p.tech?.length
                                        ? el("p", { class: "stack" }, p.tech.join(", "))
                                        : null,
                                ]),
                            ]),
                        ),
                    ),
                ], "projects");

                const sideBlock = data.sideProjects?.length
                    ? block("외주 프로젝트", "모과플레이부터 프리랜서 시절까지의 외주 작업, 최근 것부터", [
                          el("div", { class: "body" }, [
                              el(
                                  "ul",
                                  { class: "side-list" },
                                  data.sideProjects.map((item) =>
                                      el("li", { class: "side-item" }, [
                                          el("h3", {}, [
                                              item.title,
                                              item.role ? el("span", { class: "role" }, item.role) : null,
                                          ]),
                                          el("p", {}, text(item.body)),
                                          item.tech ? el("p", { class: "tech" }, item.tech) : null,
                                      ]),
                                  ),
                              ),
                          ]),
                      ])
                    : "";

                const simpleList = (items) =>
                    el(
                        "div",
                        { class: "entries" },
                        items.map((item) =>
                            el("article", { class: "entry" }, [
                                el("div", { class: "rail" }, [
                                    el("p", { class: "period" }, item.period || ""),
                                ]),
                                el("div", {}, [
                                    el("h3", {}, text(item.title)),
                                    item.note ? el("p", { class: "sub" }, text(item.note)) : null,
                                ]),
                            ]),
                        ),
                    );

                root.replaceChildren(
                    el("header", { class: "masthead" }, [head, contacts, buildTimeline()]),
                    about,
                    skills,
                    experience,
                    projectBlock,
                    sideBlock,
                    data.education?.length ? block("학력 · 교육", null, [simpleList(data.education)]) : "",
                    data.extras?.length ? block("자격 · 기타", null, [simpleList(data.extras)]) : "",
                );

                // ── 도구 막대 ────────────────────────────────
                document.getElementById("print").addEventListener("click", () => window.print());

                const themeButton = document.getElementById("theme");
                const html = document.documentElement;
                const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");
                const isDark = () =>
                    html.dataset.theme ? html.dataset.theme === "dark" : prefersDark.matches;
                const syncLabel = () => {
                    themeButton.textContent = isDark() ? "밝은 화면" : "어두운 화면";
                };
                try {
                    const saved = localStorage.getItem("resume-theme");
                    if (saved) html.dataset.theme = saved;
                } catch {}
                syncLabel();
                themeButton.addEventListener("click", () => {
                    html.dataset.theme = isDark() ? "light" : "dark";
                    try {
                        localStorage.setItem("resume-theme", html.dataset.theme);
                    } catch {}
                    syncLabel();
                });
                prefersDark.addEventListener("change", syncLabel);
            })();
        </script>
    </body>
</html>
